# LightSpeed Evaluation Configuration — No-tools variant (OSSM without Kiali toolset)
#
# Used when MCP_ENABLED=false (make test-without-mcp).  The OLS instance is
# started without MCP integration (olsconfig-openai-no-mcp.yaml), so no tools
# are available.  Setting no_tools: true here makes that constraint explicit at
# the eval-framework level: the /query request sent to OLS carries no_tools=true
# regardless of what the MCP server may expose.  This is belt-and-suspenders —
# the primary control is the OLS config; this config adds a second layer so the
# eval log clearly records that tools were intentionally disabled.
#
# max_tokens raised to 16000 (vs 5000 in the MCP variant): without tool call
# output the judge receives longer free-text answers and needs more room to
# reason about correctness.

core:
  max_threads: 5

llm:
  provider: "openai"
  model: "gpt-5.4-mini"
  temperature: 0.0
  max_tokens: 5000
  timeout: 300
  num_retries: 3
  cache_enabled: true

api:
  enabled: true
  api_base: http://0.0.0.0:8080
  endpoint_type: query
  timeout: 300
  provider: "openai"
  model: "gpt-5"   # must match olsconfig-openai-no-mcp.yaml default_model
  no_tools: true
  system_prompt: null
  cache_enabled: false
  extra_request_params:
    mode: troubleshooting

metrics_metadata:
  turn_level:
    "custom:answer_correctness":
      description: "Correctness vs expected answer using custom LLM evaluation"
      default: true

  conversation_level:
    "deepeval:conversation_completeness":
      threshold: 0.6
      description: "How completely the conversation addresses user intentions"
      default: false

    "deepeval:conversation_relevancy":
      threshold: 0.7
      description: "How relevant the conversation is to the topic/context"

    "deepeval:knowledge_retention":
      threshold: 0.6
      description: "How well the model retains information from previous turns"

    "geval:troubleshooting_continuity":
      description: "Evaluates stateful debugging across turns using context as history"
      evaluation_params:
        - query
        - response
      criteria: |
        The agent must demonstrate 'Stateful Troubleshooting'.
        1. It must reference specific facts found in earlier turns.
        2. It must not repeat tool calls already present in the conversation history.
        3. It must use the current tool output to progress the investigation.
      evaluation_steps:
        - "Step 1: Verify the agent references findings from earlier conversation turns."
        - "Step 2: Check the agent doesn't repeat diagnostic steps already completed."
        - "Step 3: Verify the agent isn't asking for information already provided in the history."
        - "Step 4: Confirm the agent uses real cluster data from the tools to answer the current 'query'."
      rubrics:
        - score_range: [0, 3]
          expected_outcome: "Agent ignores history entirely, restarts the investigation, or provides generic help."
        - score_range: [4, 7]
          expected_outcome: "Agent maintains basic context but repeats questions or diagnostic steps unnecessarily."
        - score_range: [8, 10]
          expected_outcome: "Perfect continuity. References specific historical data to provide a conclusive fix."

output:
  output_dir: "./eval_output"
  base_filename: "evaluation"
  enabled_outputs:
    - csv
    - json
  csv_columns:
    - "conversation_group_id"
    - "turn_id"
    - "metric_identifier"
    - "score"
    - "threshold"
    - "result"
    - "reason"
    - "query"
    - "response"
    - "tool_calls"
    - "expected_tool_calls"
    - "execution_time"

visualization:
  figsize: [12, 8]
  dpi: 300
  enabled_graphs:
    - "pass_rates"
    - "score_distribution"
    - "conversation_heatmap"
    - "status_breakdown"

environment:
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
  DEEPEVAL_DISABLE_PROGRESS_BAR: "YES"
  CONFIDENT_METRIC_LOGGING_VERBOSE: "0"
  LITELLM_LOG: ERROR

logging:
  source_level: INFO
  package_level: ERROR
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  show_timestamps: true
  package_overrides:
    httpx: ERROR
    urllib3: ERROR
    requests: ERROR
    matplotlib: ERROR
    LiteLLM: WARNING
    DeepEval: WARNING
    ragas: WARNING
